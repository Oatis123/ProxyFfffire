name: ProxyFfffire Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Test local proxies and Windows settings recovery
        run: python -m unittest discover -s tests -v
      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.22.0
          if ($LASTEXITCODE) { throw 'PyInstaller installation failed.' }
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'Inno Setup 6'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          $signature = Get-AuthenticodeSignature -FilePath $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') {
            throw 'Inno Setup signature validation failed.'
          }
          $flags = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /NOICONS /DIR="' + $compiler + '"'
          $process = Start-Process -FilePath $download -ArgumentList $flags -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
          "INNO_COMPILER=$(Join-Path $compiler 'ISCC.exe')" >> $env:GITHUB_ENV
      - name: Build installer and checksum
        run: ./installer/build.ps1 -Tag $env:GITHUB_REF_NAME -Python python -Iscc $env:INNO_COMPILER
      - name: Verify install, bundled launch, reinstall and uninstall
        run: ./installer/smoke-test.ps1 -Installer "release/ProxyClient-Setup-${env:GITHUB_REF_NAME}-x64.exe"
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $file = "release/ProxyClient-Setup-$tag-x64.exe"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file "$file.sha256" --clobber
          } else {
            gh release create $tag $file "$file.sha256" --verify-tag --title "ProxyFfffire $tag" --generate-notes
          }
          if ($LASTEXITCODE) { throw 'GitHub Release publication failed.' }
